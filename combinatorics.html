<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Комбинаторика</title>
  <style>
    body {
      background-color: #1e293b;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #334155;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .back-btn {
      color: #38bdf8;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      background-color: #0f172a;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #334155;
      transition: border-color 0.2s;
    }

    .back-btn:hover {
      border-color: #38bdf8;
    }

    .pdf-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    @media (max-width: 1024px) {
      .pdf-grid {
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      }
    }

    .pdf-card {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 190px;
      text-decoration: none;
      box-sizing: border-box;
      transition: border-color 0.2s, transform 0.2s;
    }

    .pdf-card:hover {
      border-color: #38bdf8;
      transform: translateY(-2px);
    }

    .pdf-icon {
      font-size: 48px;
    }

    .pdf-name {
      color: #38bdf8;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      width: 100%;
    }

    .add-btn {
      background-color: #0f172a;
      border: 2px dashed #38bdf8;
      color: #38bdf8;
      border-radius: 8px;
      height: 190px;
      font-size: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.2s;
      box-sizing: border-box;
    }

    .add-btn:hover {
      background-color: #1e293b;
      transform: scale(1.02);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>📊 Комбинаторика</h1>
    <a href="index.html" class="back-btn">← На главную</a>
  </div>

  <p>Загруженные PDF по комбинаторике:</p>

  <input type="file" id="combinatoricsPdfInput" accept="application/pdf" style="display: none;" onchange="handleFileUpload(event, 'combinatorics')">
  <div id="combinatoricsGrid" class="pdf-grid">
    <button type="button" id="combinatoricsAddBtn" class="add-btn" onclick="triggerUpload('combinatoricsPdfInput')">+</button>
  </div>

  <script>
    const UPLOAD_PASSWORD = "343216125";

    document.addEventListener("DOMContentLoaded", () => {
      loadSavedPdfs('combinatorics');
    });

    function triggerUpload(inputId) {
      const password = prompt("Введите пароль для загрузки PDF:");
      if (password === UPLOAD_PASSWORD) {
        document.getElementById(inputId).click();
      } else if (password !== null) {
        alert("Неверный пароль!");
      }
    }

    function handleFileUpload(event, section) {
      const file = event.target.files[0];
      if (file && file.type === 'application/pdf') {
        const reader = new FileReader();
        reader.onload = function(e) {
          const fileData = {
            name: file.name,
            url: e.target.result
          };
          savePdfToStorage(section, fileData);
          renderPdfCard(section, fileData);
        };
        reader.readAsDataURL(file);
        event.target.value = '';
      }
    }

    function renderPdfCard(section, fileData) {
      const grid = document.getElementById(section + 'Grid');
      const addBtn = document.getElementById(section + 'AddBtn');

      const card = document.createElement('a');
      card.className = 'pdf-card';
      card.href = fileData.url;
      card.target = '_blank';

      const icon = document.createElement('div');
      icon.className = 'pdf-icon';
      icon.textContent = '📄';

      const name = document.createElement('div');
      name.className = 'pdf-name';
      name.textContent = fileData.name;

      card.appendChild(icon);
      card.appendChild(name);

      grid.insertBefore(card, addBtn);
    }

    function savePdfToStorage(section, fileData) {
      let saved = JSON.parse(localStorage.getItem(section + '_pdfs') || '[]');
      saved.push(fileData);
      try {
        localStorage.setItem(section + '_pdfs', JSON.stringify(saved));
      } catch (e) {
        alert("Размер файла превышает лимит памяти браузера.");
      }
    }

    function loadSavedPdfs(section) {
      let saved = JSON.parse(localStorage.getItem(section + '_pdfs') || '[]');
      saved.forEach(fileData => renderPdfCard(section, fileData));
    }
  </script>
</body>
</html>
