<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C++ & Math Blog</title>
  <style>
    body {
      background-color: #1e293b;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    /* Шапка сайта */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #334155;
      padding-bottom: 15px;
      margin-bottom: 20px;
      position: relative;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    /* Иконка трех полосок (гамбургер-меню) */
    .menu-icon {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 26px;
      height: 20px;
      cursor: pointer;
      padding: 5px;
    }

    .menu-icon span {
      display: block;
      height: 3px;
      width: 100%;
      background-color: #38bdf8;
      border-radius: 2px;
      transition: 0.3s;
    }

    /* Выпадающее меню */
    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 50px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      z-index: 10;
      min-width: 140px;
    }

    .dropdown-menu.show {
      display: flex;
      flex-direction: column;
    }

    /* Кнопки в меню */
    .tab-btn {
      background: none;
      border: none;
      color: #94a3b8;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      text-align: left;
      transition: background 0.2s, color 0.2s;
    }

    .tab-btn:hover {
      background-color: #1e293b;
      color: #e2e8f0;
    }

    .tab-btn.active {
      color: #38bdf8;
      font-weight: bold;
      background-color: #1e293b;
    }

    /* Контент вкладок */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>My Blog</h1>
    
    <!-- Иконка из 3 полосок -->
    <div class="menu-icon" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Выпадающее меню -->
    <div id="dropdownMenu" class="dropdown-menu">
      <button class="tab-btn active" onclick="openTab(event, 'home')">Home</button>
      <button class="tab-btn" onclick="openTab(event, 'math')">Math</button>
      <button class="tab-btn" onclick="openTab(event, 'cpp')">C++</button>
    </div>
  </div>

  <!-- Содержимое страниц -->
  <div id="home" class="tab-content active">
    <h2>Welcome to Home Page</h2>
    <p>Это главная страница, которая открывается по умолчанию при заходе на сайт.</p>
  </div>

  <div id="math" class="tab-content">
    <h2>Math Section</h2>
    <p>Здесь будут размещаться материалы, формулы и задачи по математике.</p>
  </div>

  <div id="cpp" class="tab-content">
    <h2>C++ Section</h2>
    <p>Здесь будут статьи, заметки и задачи по программированию на C++.</p>
  </div>

  <script>
    // Открытие и закрытие меню по клику на полоски
    function toggleMenu() {
      document.getElementById('dropdownMenu').classList.toggle('show');
    }

    // Переключение вкладок
    function openTab(evt, tabName) {
      const contents = document.querySelectorAll('.tab-content');
      contents.forEach(content => content.classList.remove('active'));

      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(button => button.classList.remove('active'));

      document.getElementById(tabName).classList.add('active');
      evt.currentTarget.classList.add('active');

      // Закрываем меню после выбора пункта
      document.getElementById('dropdownMenu').classList.remove('show');
    }

    // Закрытие меню при клике вне его области
    window.onclick = function(event) {
      if (!event.target.matches('.menu-icon') && !event.target.matches('.menu-icon span')) {
        const dropdown = document.getElementById('dropdownMenu');
        if (dropdown.classList.contains('show')) {
          dropdown.classList.remove('show');
        }
      }
    }
  </script>

</body>
</html>
