<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website</title>
  <style>
    body {
      background-color: #1e293b;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #334155;
      padding-bottom: 15px;
      margin-bottom: 20px;
      position: relative;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .menu-icon {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 26px;
      height: 20px;
      cursor: pointer;
      padding: 5px;
    }

    .menu-icon span {
      display: block;
      height: 3px;
      width: 100%;
      background-color: #38bdf8;
      border-radius: 2px;
      transition: 0.3s;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 50px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      z-index: 10;
      min-width: 140px;
    }

    .dropdown-menu.show {
      display: flex;
      flex-direction: column;
    }

    .tab-btn {
      background: none;
      border: none;
      color: #94a3b8;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      text-align: left;
      transition: background 0.2s, color 0.2s;
    }

    .tab-btn:hover {
      background-color: #1e293b;
      color: #e2e8f0;
    }

    .tab-btn.active {
      color: #38bdf8;
      font-weight: bold;
      background-color: #1e293b;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .pdf-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    .pdf-card {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      height: 220px;
    }

    .pdf-card embed {
      width: 100%;
      height: 150px;
      border: none;
      border-radius: 4px;
    }

    .pdf-card a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .pdf-card a:hover {
      text-decoration: underline;
    }

    .add-btn {
      background-color: #0f172a;
      border: 2px dashed #38bdf8;
      color: #38bdf8;
      border-radius: 8px;
      height: 220px;
      font-size: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.2s;
    }

    .add-btn:hover {
      background-color: #1e293b;
      transform: scale(1.02);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>My Website</h1>
    
    <div class="menu-icon" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div id="dropdownMenu" class="dropdown-menu">
      <button class="tab-btn active" onclick="openTab(event, 'home')">Home</button>
      <button class="tab-btn" onclick="openTab(event, 'math')">Math</button>
      <button class="tab-btn" onclick="openTab(event, 'cpp')">C++</button>
    </div>
  </div>

  <div id="home" class="tab-content active">
    <h2>Home Page</h2>
    <p>Welcome to the home page.</p>
  </div>

  <div id="math" class="tab-content">
    <h2>Math Page</h2>
    <p>Welcome to the math section.</p>
    <input type="file" id="mathPdfInput" accept="application/pdf" style="display: none;" onchange="handleFileUpload(event, 'mathGrid', 'mathAddBtn')">
    <div id="mathGrid" class="pdf-grid">
      <button id="mathAddBtn" class="add-btn" onclick="triggerUpload('mathPdfInput')">+</button>
    </div>
  </div>

  <div id="cpp" class="tab-content">
    <h2>C++ Page</h2>
    <p>Welcome to the C++ section.</p>
    <input type="file" id="cppPdfInput" accept="application/pdf" style="display: none;" onchange="handleFileUpload(event, 'cppGrid', 'cppAddBtn')">
    <div id="cppGrid" class="pdf-grid">
      <button id="cppAddBtn" class="add-btn" onclick="triggerUpload('cppPdfInput')">+</button>
    </div>
  </div>

  <script>
    const UPLOAD_PASSWORD = "343216125";

    function toggleMenu() {
      document.getElementById('dropdownMenu').classList.toggle('show');
    }

    function openTab(evt, tabName) {
      const contents = document.querySelectorAll('.tab-content');
      contents.forEach(content => content.classList.remove('active'));

      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(button => button.classList.remove('active'));

      document.getElementById(tabName).classList.add('active');
      evt.currentTarget.classList.add('active');

      document.getElementById('dropdownMenu').classList.remove('show');
    }

    function triggerUpload(inputId) {
      const password = prompt("Enter password to upload PDF:");
      if (password === UPLOAD_PASSWORD) {
        document.getElementById(inputId).click();
      } else if (password !== null) {
        alert("Incorrect password!");
      }
    }

    function handleFileUpload(event, gridId, addBtnId) {
      const file = event.target.files[0];
      if (file && file.type === 'application/pdf') {
        const fileUrl = URL.createObjectURL(file);
        const grid = document.getElementById(gridId);
        const addBtn = document.getElementById(addBtnId);

        const card = document.createElement('div');
        card.className = 'pdf-card';

        const embed = document.createElement('embed');
        embed.src = fileUrl;
        embed.type = 'application/pdf';

        const link = document.createElement('a');
        link.href = fileUrl;
        link.target = '_blank';
        link.textContent = file.name;

        card.appendChild(embed);
        card.appendChild(link);

        grid.insertBefore(card, addBtn);
        event.target.value = '';
      }
    }

    window.onclick = function(event) {
      if (!event.target.matches('.menu-icon') && !event.target.matches('.menu-icon span')) {
        const dropdown = document.getElementById('dropdownMenu');
        if (dropdown.classList.contains('show')) {
          dropdown.classList.remove('show');
        }
      }
    }
  </script>

</body>
</html>
